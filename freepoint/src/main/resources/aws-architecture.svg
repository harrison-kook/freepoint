<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 640" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1250" height="640" fill="#ffffff"/>

  <text x="20" y="28" font-size="20" font-weight="bold" fill="#111827">무료 포인트 시스템 - AWS 배포 아키텍처 (예시)</text>
  <text x="20" y="46" font-size="12" fill="#6b7280" font-style="italic">실선 = 요청 트래픽 흐름 · 점선 = 부가 연동(로그/자격증명/복제)</text>

  <!-- Client -->
  <rect x="20" y="290" width="140" height="60" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="90" y="315" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">사용자</text>
  <text x="90" y="332" font-size="11" text-anchor="middle" fill="#374151">(Client / Web·App)</text>

  <!-- Route53 -->
  <rect x="200" y="290" width="140" height="60" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="270" y="315" font-size="13" font-weight="bold" text-anchor="middle" fill="#831843">Route 53</text>
  <text x="270" y="332" font-size="11" text-anchor="middle" fill="#831843">DNS</text>

  <!-- VPC boundary -->
  <rect x="380" y="60" width="700" height="530" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="392" y="80" font-size="13" font-weight="bold" fill="#2563eb">VPC</text>

  <!-- Public Subnet -->
  <rect x="400" y="95" width="660" height="95" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="410" y="110" font-size="11" fill="#6b7280">Public Subnet (Multi-AZ)</text>
  <rect x="430" y="120" width="220" height="55" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="540" y="143" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Application</text>
  <text x="540" y="159" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Load Balancer</text>

  <!-- Private App Subnet -->
  <rect x="400" y="205" width="660" height="140" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="410" y="220" font-size="11" fill="#6b7280">Private Subnet - App (Multi-AZ)</text>
  <rect x="430" y="240" width="220" height="80" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="540" y="268" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ECS Fargate Task</text>
  <text x="540" y="285" font-size="11.5" text-anchor="middle" fill="#1e3a8a">Spring Boot App (fps)</text>
  <text x="540" y="301" font-size="11" text-anchor="middle" fill="#1e3a8a">AZ-a</text>

  <rect x="700" y="240" width="220" height="80" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="810" y="268" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ECS Fargate Task</text>
  <text x="810" y="285" font-size="11.5" text-anchor="middle" fill="#1e3a8a">Spring Boot App (fps)</text>
  <text x="810" y="301" font-size="11" text-anchor="middle" fill="#1e3a8a">AZ-c</text>

  <!-- Private DB Subnet -->
  <rect x="400" y="360" width="660" height="150" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="410" y="375" font-size="11" fill="#6b7280">Private Subnet - DB (Multi-AZ)</text>
  <rect x="450" y="395" width="240" height="85" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="570" y="423" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d">Amazon RDS (MySQL)</text>
  <text x="570" y="440" font-size="11.5" text-anchor="middle" fill="#14532d">Primary (AZ-a)</text>
  <text x="570" y="456" font-size="11" text-anchor="middle" fill="#14532d">H2 → RDS 전환 (운영 환경)</text>

  <rect x="730" y="395" width="240" height="85" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="850" y="423" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d">Standby Replica</text>
  <text x="850" y="440" font-size="11.5" text-anchor="middle" fill="#14532d">(AZ-c, 동기 복제)</text>
  <text x="850" y="456" font-size="11" text-anchor="middle" fill="#14532d">자동 장애조치(Failover)</text>

  <!-- Outside VPC: observability / secrets -->
  <rect x="1000" y="205" width="200" height="65" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1100" y="232" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#78350f">CloudWatch</text>
  <text x="1100" y="249" font-size="11" text-anchor="middle" fill="#78350f">Logs / Metrics / Alarm</text>

  <rect x="1000" y="395" width="200" height="65" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1100" y="422" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#78350f">Secrets Manager</text>
  <text x="1100" y="439" font-size="11" text-anchor="middle" fill="#78350f">DB 자격증명</text>

  <!-- Arrows: request flow (solid) -->
  <line x1="160" y1="320" x2="200" y2="320" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="340" y1="320" x2="430" y2="320" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="540" y1="175" x2="540" y2="240" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="650" y1="150" x2="810" y2="240" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="540" y1="320" x2="560" y2="395" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="810" y1="320" x2="580" y2="395" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Replication (dashed) -->
  <line x1="690" y1="437" x2="730" y2="437" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- Logs (dashed) to CloudWatch -->
  <line x1="650" y1="260" x2="1000" y2="235" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <line x1="810" y1="260" x2="1000" y2="245" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>

  <!-- Secrets (dashed) to ECS -->
  <line x1="1000" y1="420" x2="920" y2="290" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Legend / notes -->
  <text x="20" y="560" font-size="12.5" font-weight="bold" fill="#111827">배포 파이프라인 (예시)</text>
  <text x="20" y="580" font-size="11.5" fill="#374151">GitHub Actions (CI: ./gradlew test) → Docker 이미지 빌드 → Amazon ECR 푸시 → ECS 서비스 롤링/블루-그린 업데이트</text>
  <text x="20" y="600" font-size="11.5" fill="#374151">과제 실행 환경은 H2(인메모리)를 사용합니다.</text>
  <text x="20" y="618" font-size="11.5" fill="#374151">실제 운영 환경에서는 RDS(MySQL/PostgreSQL) 등 영속 스토리지로 교체가 필요합니다.</text>
</svg>
